# Cloudflare Workers : `npm run build` produit `dist`, puis `npx wrangler deploy`.
# Le nom doit correspondre au Worker créé dans le tableau de bord Cloudflare.
name = "mlkfifa"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Les appels /api/* passent par le Worker (relais Melbet) avant les fichiers statiques.
run_worker_first = ["/api/*"]
