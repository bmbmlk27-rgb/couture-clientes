<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couture Clientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : barre d'atelier en haut, onglets, contenu en une colonne large avec cartes-fiches */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1d2340; --muted:#5d6482; --line:#dcdfe8;
  --accent:#e8b424; --accent-ink:#2a2000; --thread:#2f3a8f;
  --ok:#1f7a4d; --warn:#b5651d; --bad:#b3261e; --chip:#eceef5;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152a; --surface:#1b1f3a; --ink:#e9ebf7; --muted:#a3a9c8; --line:#2e3460;
  --accent:#f0c14b; --accent-ink:#231a00; --thread:#9aa6ff;
  --ok:#5cc98f; --warn:#e9a25c; --bad:#ff8a80; --chip:#262b50; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152a; --surface:#1b1f3a; --ink:#e9ebf7; --muted:#a3a9c8; --line:#2e3460;
  --accent:#f0c14b; --accent-ink:#231a00; --thread:#9aa6ff;
  --ok:#5cc98f; --warn:#e9a25c; --bad:#ff8a80; --chip:#262b50; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--ink);color:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:18px;flex-wrap:wrap}
.logo{font:700 1.5rem/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.tape{height:10px;width:64px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--accent-ink) 0 1px,transparent 1px 6px) bottom/100% 4px no-repeat,var(--accent)}
.top .sub{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:.85rem;margin-left:auto}
nav.tabs{display:flex;gap:4px;padding-block:12px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
main{padding-block:8px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.82rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}
label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:18px}
.notice .grow{flex:1;min-width:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:700 1.7rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.alert b{color:var(--bad)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

.list{display:grid;gap:10px;margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.item .main{min-width:0}
.item .meta{color:var(--muted);font-size:.86rem;display:flex;gap:6px 14px;flex-wrap:wrap}
.item .side{text-align:right;display:grid;gap:6px;justify-items:end}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.88rem}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill[data-s="afaire"]{background:color-mix(in srgb,var(--muted) 18%,transparent)}
.pill[data-s="encours"]{background:color-mix(in srgb,var(--thread) 20%,transparent);color:var(--thread)}
.pill[data-s="essayage"]{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill[data-s="prete"]{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.pill[data-s="livree"]{background:transparent;border:1px solid var(--line);color:var(--muted)}
.due.late{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 .8rem var(--f-body);cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* fiche mesures */
.mes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 12px;margin-top:10px}
.mes div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-block:3px;font-size:.85rem}
.mes dt{color:var(--muted)}
.mes dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details.fiche summary{cursor:pointer;color:var(--thread);font-weight:600;font-size:.86rem;margin-top:6px}

dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,18,40,.55)}
dialog form{padding:20px;display:grid;gap:14px;max-height:85vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.item .side{justify-items:start;text-align:left}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
legend{font-weight:600;font-size:.85rem;padding:0 6px}
.unit{font-weight:400;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><span class="tape" aria-hidden="true"></span>Couture Clientes</div>
    <div class="sub" id="today"></div>
  </div>
</header>
<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="accueil" aria-selected="true">Atelier</button>
    <button role="tab" data-tab="clientes" aria-selected="false">Clientes</button>
    <button role="tab" data-tab="commandes" aria-selected="false">Commandes</button>
  </nav>
  <main id="view"></main>
</div>

<!-- Fiche cliente -->
<dialog id="dlgClient">
  <form id="fClient" method="dialog">
    <h2 id="fClientTitle">Nouvelle cliente</h2>
    <div class="grid2">
      <label>Nom complet<input id="c_nom" required></label>
      <label>Téléphone<input id="c_tel" type="tel"></label>
    </div>
    <fieldset>
      <legend>Mesures <span class="unit">(en cm)</span></legend>
      <div class="grid3" id="c_mesures"></div>
    </fieldset>
    <label>Notes (morphologie, préférences…)<textarea id="c_notes"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger left" id="c_del" hidden>Supprimer</button>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- Commande -->
<dialog id="dlgCmd">
  <form id="fCmd" method="dialog">
    <h2 id="fCmdTitle">Nouvelle commande</h2>
    <label>Cliente<select id="o_client" required></select></label>
    <div class="grid2">
      <label>Vêtement / travail<input id="o_desc" required placeholder="Robe de soirée, ourlet pantalon…"></label>
      <label>Tissu<input id="o_tissu" placeholder="Wax 3 m, satin…"></label>
    </div>
    <div class="grid3">
      <label>Date de remise<input id="o_date" type="date"></label>
      <label>Prix (€)<input id="o_prix" type="number" min="0" step="0.5"></label>
      <label>Acompte (€)<input id="o_acompte" type="number" min="0" step="0.5"></label>
    </div>
    <label>Statut<select id="o_statut"></select></label>
    <label>Détails<textarea id="o_notes"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger left" id="o_del" hidden>Supprimer</button>
      <button type="button" class="btn" data-close>Annuler</button>
      <button type="submit" class="btn primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const MESURES=[
  ["poitrine","Tour de poitrine"],["taille","Tour de taille"],["hanches","Tour de hanches"],
  ["epaules","Carrure dos"],["dos","Longueur dos"],["bras","Longueur bras"],
  ["tourBras","Tour de bras"],["cou","Tour de cou"],["jupe","Longueur jupe"],
  ["robe","Longueur robe"],["entrejambe","Entrejambe"],["cuisse","Tour de cuisse"]
];
const STATUTS=[["afaire","À faire"],["encours","En cours"],["essayage","Essayage"],["prete","Prête"],["livree","Livrée"]];
const SL=Object.fromEntries(STATUTS);
const KEY="couture-clientes-v1";

function iso(d){return d.toISOString().slice(0,10)}
function inDays(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Math.random().toString(36).slice(2,10)}

function exemples(){
  const a=uid(),b=uid(),c=uid();
  return {exemple:true,clientes:[
    {id:a,nom:"Aminata Diallo",tel:"06 12 34 56 78",notes:"Préfère les coupes ajustées à la taille.",mesures:{poitrine:92,taille:74,hanches:101,epaules:38,dos:40,bras:58,tourBras:28,cou:34,jupe:62,robe:110}},
    {id:b,nom:"Claire Martin",tel:"07 45 21 09 88",notes:"Mariage le mois prochain.",mesures:{poitrine:86,taille:68,hanches:94,epaules:36,dos:39,bras:57,robe:145}},
    {id:c,nom:"Fatou Ndiaye",tel:"06 98 76 54 32",notes:"",mesures:{poitrine:98,taille:82,hanches:108,entrejambe:76,cuisse:60}}
  ],commandes:[
    {id:uid(),client:a,desc:"Robe de soirée en wax",tissu:"Wax 4 m",date:inDays(5),prix:180,acompte:60,statut:"encours",notes:"Manches bouffantes"},
    {id:uid(),client:b,desc:"Retouche robe de mariée",tissu:"",date:inDays(2),prix:120,acompte:120,statut:"essayage",notes:"Reprendre la taille de 2 cm"},
    {id:uid(),client:c,desc:"Ensemble pagne + haut",tissu:"Bazin 5 m",date:inDays(-1),prix:150,acompte:50,statut:"encours",notes:""},
    {id:uid(),client:a,desc:"Ourlet pantalon",tissu:"",date:inDays(12),prix:15,acompte:0,statut:"afaire",notes:""},
    {id:uid(),client:b,desc:"Jupe crayon",tissu:"Crêpe noir 1,5 m",date:inDays(-10),prix:70,acompte:70,statut:"livree",notes:""}
  ]};
}

let db;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){db=JSON.parse(raw);return}}catch(e){}
  db=exemples();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
load();

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const fdate=s=>s?new Date(s+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}):"—";
const client=id=>db.clientes.find(c=>c.id===id);
function delai(o){
  if(!o.date||o.statut==="livree")return {cls:"",txt:fdate(o.date)};
  const d=Math.round((new Date(o.date+"T12:00")-new Date(iso(new Date())+"T12:00"))/864e5);
  if(d<0)return {cls:"late",txt:`En retard de ${-d} j`};
  if(d===0)return {cls:"soon",txt:"Aujourd'hui"};
  if(d<=3)return {cls:"soon",txt:`Dans ${d} j · ${fdate(o.date)}`};
  return {cls:"",txt:fdate(o.date)};
}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

$("#today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

let tab="accueil", filtre="actives", recherche="";
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});

function noticeExemple(){
  return db.exemple?`<div class="notice"><span class="grow">Ce sont des <b>données d'exemple</b> pour vous montrer le fonctionnement. Effacez-les pour commencer avec vos propres clientes.</span><button class="btn small" id="clearEx">Effacer les exemples</button></div>`:"";
}

function cmdItem(o){
  const c=client(o.client),dl=delai(o),reste=(+o.prix||0)-(+o.acompte||0);
  return `<div class="item">
    <div class="main"><h3>${esc(o.desc)}</h3>
      <div class="meta"><span>${esc(c?c.nom:"Cliente supprimée")}</span>${o.tissu?`<span>${esc(o.tissu)}</span>`:""}<span class="due ${dl.cls}">${dl.txt}</span></div>
      ${o.notes?`<div class="meta">${esc(o.notes)}</div>`:""}
    </div>
    <div class="side"><span class="pill" data-s="${o.statut}">${SL[o.statut]}</span>
      <span class="money">${eur(o.prix)}${reste>0?` · reste <b>${eur(reste)}</b>`:" · payé"}</span>
      <button class="btn small" data-edit-cmd="${o.id}">Modifier</button></div>
  </div>`;
}
const triDate=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999");

function viewAccueil(){
  const actives=db.commandes.filter(o=>o.statut!=="livree");
  const today=iso(new Date());
  const retard=actives.filter(o=>o.date&&o.date<today);
  const semaine=actives.filter(o=>o.date&&o.date>=today&&o.date<=inDays(7));
  const aEncaisser=actives.reduce((s,o)=>s+Math.max(0,(+o.prix||0)-(+o.acompte||0)),0);
  const prochaines=[...actives].sort(triDate).slice(0,6);
  return `${noticeExemple()}
  <div class="row"><h2 class="grow">Atelier</h2>
    <button class="btn" id="addClient">+ Cliente</button><button class="btn primary" id="addCmd">+ Commande</button></div>
  <div class="stats">
    <div class="stat"><b>${actives.length}</b><span>Commandes en cours</span></div>
    <div class="stat ${retard.length?"alert":""}"><b>${retard.length}</b><span>En retard</span></div>
    <div class="stat"><b>${semaine.length}</b><span>À rendre sous 7 j</span></div>
    <div class="stat"><b class="money" style="font-size:1.35rem">${eur(aEncaisser)}</b><span>Reste à encaisser</span></div>
  </div>
  <h3>Prochaines remises</h3>
  <div class="list">${prochaines.length?prochaines.map(cmdItem).join(""):`<div class="empty">Aucune commande en cours. Ajoutez-en une avec « + Commande ».</div>`}</div>`;
}

function viewClientes(){
  const q=recherche.toLowerCase();
  const list=db.clientes.filter(c=>!q||c.nom.toLowerCase().includes(q)||(c.tel||"").includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
  return `${noticeExemple()}
  <div class="row"><h2 class="grow">Clientes <span class="unit">(${db.clientes.length})</span></h2><button class="btn primary" id="addClient">+ Cliente</button></div>
  <div style="margin-top:12px"><input id="search" placeholder="Rechercher par nom ou téléphone" value="${esc(recherche)}" aria-label="Rechercher"></div>
  <div class="list">${list.length?list.map(c=>{
    const n=db.commandes.filter(o=>o.client===c.id&&o.statut!=="livree").length;
    const mes=MESURES.filter(([k])=>c.mesures&&c.mesures[k]);
    return `<div class="item"><div class="main"><h3>${esc(c.nom)}</h3>
      <div class="meta">${c.tel?`<span>${esc(c.tel)}</span>`:""}<span>${n} commande${n>1?"s":""} en cours</span><span>${mes.length} mesure${mes.length>1?"s":""}</span></div>
      ${c.notes?`<div class="meta">${esc(c.notes)}</div>`:""}
      ${mes.length?`<details class="fiche"><summary>Voir les mesures</summary><dl class="mes">${mes.map(([k,l])=>`<div><dt>${l}</dt><dd>${c.mesures[k]}</dd></div>`).join("")}</dl></details>`:""}
    </div><div class="side"><button class="btn small" data-edit-client="${c.id}">Modifier</button><button class="btn small" data-cmd-for="${c.id}">+ Commande</button></div></div>`;
  }).join(""):`<div class="empty">${q?"Aucune cliente ne correspond.":"Pas encore de cliente. Ajoutez la première avec « + Cliente »."}</div>`}</div>`;
}

function viewCommandes(){
  const F=[["actives","En cours"],...STATUTS,["toutes","Toutes"]];
  const list=db.commandes.filter(o=>filtre==="toutes"||(filtre==="actives"?o.statut!=="livree":o.statut===filtre)).sort(triDate);
  return `${noticeExemple()}
  <div class="row"><h2 class="grow">Commandes</h2><button class="btn primary" id="addCmd">+ Commande</button></div>
  <div class="filters">${F.map(([k,l])=>`<button data-f="${k}" aria-pressed="${filtre===k}">${l}</button>`).join("")}</div>
  <div class="list">${list.length?list.map(cmdItem).join(""):`<div class="empty">Aucune commande dans cette catégorie.</div>`}</div>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  $("#view").innerHTML=tab==="accueil"?viewAccueil():tab==="clientes"?viewClientes():viewCommandes();
  const s=$("#search");if(s){s.oninput=()=>{recherche=s.value;const p=s.selectionStart;render();const n=$("#search");n.focus();n.setSelectionRange(p,p)}}
}

$("#view").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="addClient")openClient();
  else if(t.id==="addCmd")openCmd();
  else if(t.id==="clearEx"){db={clientes:[],commandes:[]};save();render();toast("Exemples effacés")}
  else if(t.dataset.editClient)openClient(t.dataset.editClient);
  else if(t.dataset.editCmd)openCmd(t.dataset.editCmd);
  else if(t.dataset.cmdFor)openCmd(null,t.dataset.cmdFor);
  else if(t.dataset.f){filtre=t.dataset.f;render()}
});

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
function armDelete(btn,fn){
  btn.textContent="Supprimer";btn.dataset.armed="";
  btn.onclick=()=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed="1";btn.textContent="Confirmer la suppression"}};
}
function leaveExample(){if(db.exemple){delete db.exemple}}

/* Cliente */
$("#c_mesures").innerHTML=MESURES.map(([k,l])=>`<label>${l}<input id="m_${k}" type="number" min="0" step="0.5" inputmode="decimal"></label>`).join("");
let editClient=null;
function openClient(id){
  editClient=id||null;const c=id?client(id):{nom:"",tel:"",notes:"",mesures:{}};
  $("#fClientTitle").textContent=id?"Modifier la cliente":"Nouvelle cliente";
  $("#c_nom").value=c.nom;$("#c_tel").value=c.tel||"";$("#c_notes").value=c.notes||"";
  MESURES.forEach(([k])=>$("#m_"+k).value=(c.mesures||{})[k]??"");
  const del=$("#c_del");del.hidden=!id;
  armDelete(del,()=>{db.clientes=db.clientes.filter(x=>x.id!==id);db.commandes=db.commandes.filter(o=>o.client!==id);leaveExample();save();$("#dlgClient").close();render();toast("Cliente supprimée")});
  $("#dlgClient").showModal();
}
$("#fClient").addEventListener("submit",e=>{
  e.preventDefault();
  const mesures={};MESURES.forEach(([k])=>{const v=$("#m_"+k).value;if(v!=="")mesures[k]=+v});
  const data={nom:$("#c_nom").value.trim(),tel:$("#c_tel").value.trim(),notes:$("#c_notes").value.trim(),mesures};
  if(editClient)Object.assign(client(editClient),data);else db.clientes.push({id:uid(),...data});
  leaveExample();save();$("#dlgClient").close();render();toast("Cliente enregistrée");
});

/* Commande */
$("#o_statut").innerHTML=STATUTS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
let editCmd=null;
function openCmd(id,pourClient){
  if(!db.clientes.length){toast("Ajoutez d'abord une cliente");openClient();return}
  editCmd=id||null;const o=id?db.commandes.find(x=>x.id===id):{client:pourClient||"",desc:"",tissu:"",date:inDays(14),prix:"",acompte:"",statut:"afaire",notes:""};
  $("#fCmdTitle").textContent=id?"Modifier la commande":"Nouvelle commande";
  $("#o_client").innerHTML=[...db.clientes].sort((a,b)=>a.nom.localeCompare(b.nom,"fr")).map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("");
  if(o.client)$("#o_client").value=o.client;
  $("#o_desc").value=o.desc;$("#o_tissu").value=o.tissu||"";$("#o_date").value=o.date||"";
  $("#o_prix").value=o.prix;$("#o_acompte").value=o.acompte;$("#o_statut").value=o.statut;$("#o_notes").value=o.notes||"";
  const del=$("#o_del");del.hidden=!id;
  armDelete(del,()=>{db.commandes=db.commandes.filter(x=>x.id!==id);leaveExample();save();$("#dlgCmd").close();render();toast("Commande supprimée")});
  $("#dlgCmd").showModal();
}
$("#fCmd").addEventListener("submit",e=>{
  e.preventDefault();
  const data={client:$("#o_client").value,desc:$("#o_desc").value.trim(),tissu:$("#o_tissu").value.trim(),date:$("#o_date").value,
    prix:$("#o_prix").value===""?0:+$("#o_prix").value,acompte:$("#o_acompte").value===""?0:+$("#o_acompte").value,statut:$("#o_statut").value,notes:$("#o_notes").value.trim()};
  if(editCmd)Object.assign(db.commandes.find(x=>x.id===editCmd),data);else db.commandes.push({id:uid(),...data});
  leaveExample();save();$("#dlgCmd").close();render();toast("Commande enregistrée");
});

render();
})();
</script>
</body>
</html>
